name: sync-wowless

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new wowless commits
        id: check
        run: |
          CURRENT=$(grep -oP '(?<=^ARG WOWLESS_SHA=)[0-9a-f]+' Dockerfile)
          LATEST=$(git ls-remote https://github.com/wowless/wowless.git HEAD | cut -f1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump WOWLESS_SHA
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          sed -i "s/^ARG WOWLESS_SHA=.*/ARG WOWLESS_SHA=${{ steps.check.outputs.latest }}/" Dockerfile

      - name: Create pull request
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: bump wowless to ${{ steps.check.outputs.latest }}'
          title: 'chore: bump wowless to `${{ steps.check.outputs.latest }}`'
          body: |
            Automated bump of `WOWLESS_SHA` in Dockerfile.

            `${{ steps.check.outputs.current }}` → `${{ steps.check.outputs.latest }}`

            [Compare changes](https://github.com/wowless/wowless/compare/${{ steps.check.outputs.current }}...${{ steps.check.outputs.latest }})
          branch: chore/bump-wowless
          delete-branch: true
